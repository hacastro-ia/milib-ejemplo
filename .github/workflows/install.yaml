name: Test Python Package from Nexus

on:
  push:
    branches:
      - implements

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependency from Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ENC_PASS=$(python -c "import os, urllib.parse as u; print(u.quote(os.environ['NEXUS_PASSWORD'], safe=''))")
          pip install milib-ejemplo --index-url "http://${NEXUS_USERNAME}:${ENC_PASS}@ec2-13-222-184-158.compute-1.amazonaws.com:8081/repository/Mylibrarie/simple/" --trusted-host ec2-13-222-184-158.compute-1.amazonaws.com

      - name: Probar la librería
        run: python -c "from mi_lib import saludar; print(saludar('Nexus'))"
